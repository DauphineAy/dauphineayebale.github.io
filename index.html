<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - MVP Available</title>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #ffffff;
            background-color: #0b1f15;
        }

        /* Nature Animation Background */
        .nature-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0b1f15 0%, #133824 50%, #1b4d32 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Nature Particles / Fireflies */
        .particle {
            position: absolute;
            background: rgba(168, 230, 207, 0.4);
            border-radius: 50%;
            animation: floatUp 10s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* Main Container Layout */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        /* Graphic / Illustration Placeholder */
        .hero-graphic {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: floatIcon 4s ease-in-out infinite;
        }

        .hero-graphic svg {
            width: 60px;
            height: 60px;
            fill: #a8e6cf;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Typography */
        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #a8e6cf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 300;
            color: #d1e7dd;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* CTA Button for MVP Video */
        .btn-mvp {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #a8e6cf;
            color: #0b1f15;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(168, 230, 207, 0.3);
        }

        .btn-mvp:hover {
            background: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.4);
        }

        .btn-mvp svg {
            width: 20px;
            height: 20px;
            fill: #0b1f15;
        }

        /* Footer info */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Animated Nature Background -->
    <div class="nature-bg" id="natureBg"></div>

    <div class="container">
        <!-- Graphic (Leaf/Nature SVG Icon) -->
        <div class="hero-graphic">
            <svg viewBox="0 0 24 24">
                <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.5,17 5,17.5C5.83,15.83 8,11 17,8Z" />
            </svg>
        </div>

        <!-- Main Copy -->
        <h1>Coming Soon</h1>
        <p>We are currently cultivating something extraordinary. While our full platform grows, you can take a look behind the scenes and explore our MVP progress.</p>

        <!-- MVP Video Link -->
        <a href="endelea-demo.mp4" target="_blank" class="btn-mvp">
            <svg viewBox="0 0 24 24">
                <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
            </svg>
            View MVP Video
        </a>
    </div>

    <footer>
        &copy; 2026 All Rights Reserved.
    </footer>

    <!-- Script to dynamically generate subtle floating particles/fireflies -->
    <script>
        const bg = document.getElementById('natureBg');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            let particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random sizing and positioning
            let size = Math.random() * 6 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            
            // Random animation speed and delay
            let duration = Math.random() * 8 + 6;
            let delay = Math.random() * 5;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;
            
            bg.appendChild(particle);
        }
    </script>
</body>
</html>
